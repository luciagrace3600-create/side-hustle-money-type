<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F6F2"><title>关系人格测试</title><style>
:root{--bg:#F7F6F2;--card:#fff;--text:#171717;--muted:#77736B;--accent:#B56A72;--accentSoft:#FAEFF0;--border:#E8E4DA;--shadow:0 8px 26px rgba(23,23,23,.045)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:3px}.app{width:100%;max-width:640px;margin:0 auto;min-height:100svh;padding:0 20px 46px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:750}.hero{padding:68px 0 42px}.hero h1{font-size:38px;line-height:1.2;margin:14px 0 18px;letter-spacing:-.035em}.hero p{margin:0;color:var(--muted);font-size:16px;white-space:pre-line}.meta{display:flex;gap:13px;flex-wrap:wrap;margin:24px 0;color:var(--muted);font-size:14px}.btn,.answer{border-radius:16px;min-height:52px;cursor:pointer;transition:.16s ease}.btn{border:0;width:100%;padding:14px 18px;font-weight:750}.btn-primary{background:var(--text);color:#fff}.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.btn:active,.answer:active{transform:scale(.985)}.section{padding:28px 0}.section h2{font-size:25px;line-height:1.35;margin:0 0 12px}.section p{color:var(--muted);margin:0 0 12px}.quote{font-size:21px!important;color:var(--text)!important;font-weight:720;line-height:1.55}.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.mini h3{font-size:17px;margin:0 0 5px}.mini p{margin:0}.quiz{min-height:100svh;display:flex;flex-direction:column;padding:26px 0 20px}.top{position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);padding:6px 0 20px;z-index:3}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.track{height:5px;background:#EAE6DC;border-radius:999px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--accent);border-radius:inherit;transition:width .25s}.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}.qno{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.12em}.question{font-size:25px;line-height:1.55;font-weight:750;margin:12px 0 25px}.answers{display:flex;flex-direction:column;gap:10px}.answer{background:var(--card);color:var(--text);border:1px solid var(--border);padding:15px 17px;text-align:left;font-weight:620;min-height:56px}.answer.selected{border-color:var(--accent);background:var(--accentSoft);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)}.quiz-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}.prev{width:auto;min-width:94px}.hint{font-size:12px;color:var(--muted);text-align:right}.loading{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center}.ring{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 24px;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{font-size:23px;margin:0 0 9px}.loading p{margin:0;color:var(--muted)}.result{padding-top:42px}.result-hero{text-align:center;padding:30px 20px}.result-hero h1{font-size:17px;color:var(--muted);margin:8px 0;font-weight:600}.type{font-size:38px;line-height:1.2;font-weight:820;letter-spacing:-.03em;margin:10px 0}.subtype{font-size:14px;color:var(--muted)}.keywords{margin-top:14px;color:var(--accent);font-weight:750;letter-spacing:.04em}.one-line{font-size:19px;line-height:1.65;font-weight:680;margin:22px 0 0}.result-card{margin-top:14px}.result-card h2{font-size:20px;margin:0 0 12px}.result-card p{margin:0;white-space:pre-line;color:#3E3B36}.result-card ul{margin:0;padding-left:20px;color:#3E3B36}.result-card li+li{margin-top:7px}.chart-wrap{display:flex;justify-content:center;padding:10px 0 4px}.scores{display:grid;gap:9px;margin-top:12px}.score-row{display:grid;grid-template-columns:76px 1fr 38px;gap:10px;align-items:center;font-size:14px}.bar{height:7px;background:#EEEAE1;border-radius:999px;overflow:hidden}.bar span{height:100%;display:block;background:var(--accent);border-radius:inherit}.score-row.primary{font-weight:800}.score-row.primary .bar{height:9px}.score-label{font-size:12px;color:var(--muted)}.bottom{text-align:center;margin-top:28px}.bottom h2{font-size:18px;color:var(--muted);margin:0}.bottom strong{display:block;font-size:23px;line-height:1.5;margin:12px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#171717;color:white;padding:11px 15px;border-radius:12px;font-size:13px;transition:.22s;z-index:30;width:max-content;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:520px){.app{padding-left:28px;padding-right:28px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:44px}}
@media(max-width:390px){.app{padding-left:16px;padding-right:16px}.hero{padding-top:54px}.hero h1{font-size:33px}.question{font-size:23px}.type{font-size:34px}.actions{grid-template-columns:1fr}}
</style></head><body><main id="app" class="app" aria-live="polite"></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
(() => {
'use strict';

const CONFIG={"title": "关系人格测试", "storage": "relationshipType_v1", "theme": {"accent": "#B56A72", "soft": "#FAEFF0", "bg": "#F7F6F2"}, "eyebrow": "RELATIONSHIP TYPE", "hero_title": "你在感情里是哪种人格？", "hero_text": "有人进入关系以后越来越投入。\n有人更需要空间。\n有人很会表达，\n也有人只有在足够安全时才会慢慢打开。\n\n25 道题。\n约 3 分钟。\n看看你更习惯怎样建立和维持亲密关系。", "meta": ["25 道题", "约 3 分钟", "无需注册"], "intro_eyebrow": "FIVE RELATIONSHIP SKILLS", "intro_title": "它测的不是“你会不会谈恋爱”", "intro_text": "这套趣味模型观察连接投入、边界自主、表达能力、信任安全和冲突修复五个维度。", "intro_quote": "真正影响关系质量的，往往不是你有多喜欢，而是你习惯怎样处理距离、需求和冲突。", "cards": [{"title": "连接投入", "text": "是否愿意持续表达在意、维护关系。"}, {"title": "边界自主", "text": "能否在亲密中保留自己的生活和原则。"}, {"title": "情绪表达", "text": "能否直接说出感受和需要。"}, {"title": "信任安全", "text": "能否在信息不完整时不过度猜测。"}, {"title": "冲突修复", "text": "出现矛盾后能否回到问题并修复连接。"}], "footer_cta": "看看你在关系里最明显的模式", "answers": [{"label": "非常不像我", "value": 1}, {"label": "比较不像我", "value": 2}, {"label": "说不清 / 一般", "value": 3}, {"label": "比较像我", "value": 4}, {"label": "非常像我", "value": 5}], "questions": [{"id": 1, "text": "喜欢一个人以后，我愿意让对方知道我的在意，而不是一直装作无所谓。", "dimension": "A", "reverse": false}, {"id": 2, "text": "关系再亲密，我也需要保留自己的时间、朋友和生活节奏。", "dimension": "B", "reverse": false}, {"id": 3, "text": "有不舒服的地方时，我通常能比较直接地说出来。", "dimension": "C", "reverse": false}, {"id": 4, "text": "对方一时没回复消息，我通常不会立刻想到“是不是不爱我了”。", "dimension": "T", "reverse": false}, {"id": 5, "text": "发生争执后，只要关系值得，我愿意主动把问题谈清楚。", "dimension": "R", "reverse": false}, {"id": 6, "text": "我很容易为了维持关系，把自己的需求放到最后。", "dimension": "B", "reverse": true}, {"id": 7, "text": "我会通过行动让重要的人感受到“你对我很重要”。", "dimension": "A", "reverse": false}, {"id": 8, "text": "我常常期待对方自己猜到我的情绪，不太愿意直接说。", "dimension": "C", "reverse": true}, {"id": 9, "text": "关系里出现一点冷淡，我就容易反复确认对方到底怎么想。", "dimension": "T", "reverse": true}, {"id": 10, "text": "只要发生冲突，我第一反应常常是躲开，等事情自己过去。", "dimension": "R", "reverse": true}, {"id": 11, "text": "我愿意亲近，但不希望两个人变成什么都必须一起。", "dimension": "B", "reverse": false}, {"id": 12, "text": "当我需要安慰、陪伴或帮助时，我愿意开口提出。", "dimension": "C", "reverse": false}, {"id": 13, "text": "即使非常喜欢一个人，我也不会因此放弃自己重要的原则。", "dimension": "B", "reverse": false}, {"id": 14, "text": "对方有自己的朋友和空间时，我通常能接受，不会自动理解成疏远。", "dimension": "T", "reverse": false}, {"id": 15, "text": "我愿意在关系里投入时间、注意力和持续行动，而不是只靠感觉。", "dimension": "A", "reverse": false}, {"id": 16, "text": "对方提出不同意见时，我通常能先听完，而不是立刻把它理解成否定我。", "dimension": "R", "reverse": false}, {"id": 17, "text": "我越在意一个人，反而越容易装冷淡、少表达。", "dimension": "C", "reverse": true}, {"id": 18, "text": "关系稳定以后，我仍然会主动维护，而不是觉得“反正已经在一起了”。", "dimension": "A", "reverse": false}, {"id": 19, "text": "我很需要频繁确认对方还爱不爱我、在不在乎我。", "dimension": "T", "reverse": true}, {"id": 20, "text": "如果一段关系长期让我很消耗，我能认真考虑退出，而不是只因为舍不得就一直拖。", "dimension": "B", "reverse": false}, {"id": 21, "text": "矛盾发生后，我会更关心“我们怎么解决”，而不只是“到底谁对谁错”。", "dimension": "R", "reverse": false}, {"id": 22, "text": "我能说出自己的感受，而不只是指责对方做错了什么。", "dimension": "C", "reverse": false}, {"id": 23, "text": "当对方暂时情绪不好时，我能给空间，不急着把一切都归因到自己。", "dimension": "T", "reverse": false}, {"id": 24, "text": "我喜欢通过共同经历、细节照顾或明确表达，让关系不断累积连接感。", "dimension": "A", "reverse": false}, {"id": 25, "text": "即使吵架，我也尽量不翻旧账、不冷暴力，而是围绕当前问题处理。", "dimension": "R", "reverse": false}], "dimensions": {"A": "连接投入", "B": "边界自主", "C": "情绪表达", "T": "信任安全", "R": "冲突修复"}, "profiles": {"ST": {"name": "稳定共建型", "keywords": "信任 · 沟通 · 修复 · 边界", "oneLine": "你更擅长把“喜欢”变成一段可以长期运转的关系。", "logic": "你的优势不是完全不吵架，而是关系出现摩擦后，你比较能回到问题本身：表达、倾听、修复、重新建立连接。你同时重视亲密和边界。", "strengths": ["不太依赖反复确认来获得安全感", "愿意沟通真实需求", "冲突后有修复能力", "能在亲密中保留独立性"], "risk": "你可能会高估“讲道理就能解决”的作用。并不是所有关系都值得修复，也不是所有人都有同样的沟通能力。", "need": "识别对方是否也具备共建意愿。稳定不是一个人努力维持出来的。", "first": "下一次有小摩擦时，不急着证明谁对，先说清楚：我现在感受到了什么、我需要什么、我们能怎么调整。"}, "WA": {"name": "温暖投入型", "keywords": "在意 · 付出 · 连接 · 陪伴", "oneLine": "你进入关系以后，很容易真正投入，也愿意让对方感受到你的在意。", "logic": "你重视连接感。对你来说，关系不是“有就行”，而是需要回应、互动和实际投入。你通常愿意花时间经营重要的人。", "strengths": ["愿意表达在意", "有持续投入能力", "容易给对方情绪价值", "重视共同经历和关系维护"], "risk": "投入感强的人容易把“我愿意付出”变成“我应该多承担一点”。一旦边界不足，就会逐渐失衡。", "need": "补边界。问自己：这是我真心愿意做，还是我怕不做就失去关系？", "first": "挑一件你最近其实不想答应、却准备勉强答应的事，练习用不攻击的方式说“不”。"}, "CB": {"name": "清醒边界型", "keywords": "独立 · 原则 · 选择 · 克制", "oneLine": "你会认真进入关系，但不会轻易把自己的全部生活交出去。", "logic": "你重视自主和边界。你通常比较清楚：爱一个人不意味着取消自己，也不意味着对所有要求都负责。", "strengths": ["边界意识强", "不容易被关系完全吞没", "能保留个人节奏", "遇到长期消耗时更容易做现实判断"], "risk": "边界过强时，别人可能感受到的不是“清醒”，而是“我进不去”。你可能低估明确表达在意的重要性。", "need": "补表达和柔软度。边界告诉别人哪里不能进，连接则告诉别人哪里欢迎靠近。", "first": "对一个重要的人，明确表达一次具体的在意，不用暗示，也不等对方猜。"}, "HS": {"name": "高敏确认型", "keywords": "敏感 · 在意 · 反馈 · 安全感", "oneLine": "你不是不懂爱，而是对关系中的变化和距离特别敏感。", "logic": "你对冷淡、延迟、语气变化等关系信号的感知很强。它让你更容易察觉细节，也让你更容易在信息不足时开始猜测。", "strengths": ["对关系变化敏感", "在意互动质量", "容易察觉对方情绪", "愿意为关系投入"], "risk": "最大的问题是把“我感觉到不安”快速等同于“关系真的出问题了”。频繁确认会短期缓解焦虑，长期却可能加重依赖。", "need": "补信任与自我安定能力。先处理自己的情绪，再判断关系事实。", "first": "下一次因为没回复、语气变化而不安时，先列出三个事实和三个猜测，把它们分开。"}, "IS": {"name": "独立慢热型", "keywords": "空间 · 慢热 · 克制 · 自主", "oneLine": "你不是没有感情，而是需要更长时间和更多安全空间，才会真正打开自己。", "logic": "你更习惯靠自己消化情绪，也不太喜欢高频、密集、时刻同步的关系模式。对你来说，舒服的亲密必须保留呼吸空间。", "strengths": ["独立性强", "不容易因为关系失去生活重心", "需要感情证明的频率较低", "更能独处和自我恢复"], "risk": "当你习惯把所有问题都自己处理时，对方可能不知道你在想什么。长期不表达会被误解成不在意。", "need": "补主动表达与修复能力。空间不是失联，独立也不等于什么都不用说。", "first": "下一次想躲开冲突时，不必立刻谈完，但明确告诉对方：我需要一点时间，我会在什么时候回来继续谈。"}}, "loading1": "正在分析你的关系五维画像……", "loading2": "正在匹配你最明显的关系人格……", "result_top_label": "YOUR RELATIONSHIP TYPE", "result_title": "你在关系里更接近", "chart_title": "关系五维画像", "result_sections": [{"title": "你的关系逻辑", "key": "logic", "list": false}, {"title": "你更明显的优势", "key": "strengths", "list": true}, {"title": "你最容易踩的坑", "key": "risk", "list": false}, {"title": "你需要补的一块能力", "key": "need", "list": false}, {"title": "下一步最值得练习的事", "key": "first", "list": false}], "bottom_title": "别急着问：我是不是“有问题”？", "bottom_strong": "更值得问的是：我的关系习惯，正在帮我还是限制我？", "bottom_text": "这是一套关系倾向自我观察工具，不等同于临床诊断或正式依恋量表。", "answer_hint": "想你平时真的怎么做，而不是理想中的自己。"};

let transitionTimer=null;
let state={view:'home',answers:{},current:0,completed:false,result:null};
function load(){try{const x=JSON.parse(localStorage.getItem(CONFIG.storage)||'null');if(x&&typeof x==='object')state={...state,...x};if(state.completed&&state.result)state.view='result';else if(Object.keys(state.answers||{}).length)state.view='quiz'}catch(e){}}
function save(){localStorage.setItem(CONFIG.storage,JSON.stringify(state))}
function clearAll(){localStorage.removeItem(CONFIG.storage)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function label(v){if(v<=39)return '低';if(v<=59)return '一般';if(v<=74)return '明显';return '强'}
function render(){const app=document.getElementById('app');({home:renderHome,quiz:renderQuiz,loading:renderLoading,result:renderResult}[state.view]||renderHome)(app)}
function renderHome(app){app.innerHTML=`<section class="hero"><div class="eyebrow">${esc(CONFIG.eyebrow)}</div><h1>${esc(CONFIG.hero_title)}</h1><p>${esc(CONFIG.hero_text)}</p><div class="meta">${CONFIG.meta.map(x=>`<span>${esc(x)}</span>`).join('')}</div><button class="btn btn-primary" id="start">开始测试</button></section><section class="section"><div class="eyebrow">${esc(CONFIG.intro_eyebrow||'ABOUT THIS TEST')}</div><h2>${esc(CONFIG.intro_title)}</h2><p>${esc(CONFIG.intro_text)}</p><p class="quote">${esc(CONFIG.intro_quote)}</p><div class="grid">${CONFIG.cards.map(c=>`<article class="card mini"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join('')}</div></section><section class="card bottom"><div>${CONFIG.meta.join(' · ')}</div><strong>${esc(CONFIG.footer_cta||'立即查看结果')}</strong><button class="btn btn-primary" id="start2">开始测试 →</button></section>`;document.getElementById('start').onclick=start;document.getElementById('start2').onclick=start}
function start(){state.view='quiz';state.completed=false;save();render();scrollTo({top:0})}
function renderQuiz(app){const i=Math.max(0,Math.min(state.current,CONFIG.questions.length-1)),q=CONFIG.questions[i],sel=state.answers[q.id],pct=i/CONFIG.questions.length*100;app.innerHTML=`<section class="quiz"><div class="top"><div class="progress-head"><span>${String(i+1).padStart(2,'0')} / ${CONFIG.questions.length}</span><span>${Math.round(pct)}%</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div><div class="qwrap"><div class="qno">QUESTION ${String(i+1).padStart(2,'0')}</div><div class="question">${esc(q.text)}</div><div class="answers">${CONFIG.answers.map(a=>`<button class="answer ${sel===a.value?'selected':''}" data-v="${a.value}">${esc(a.label)}</button>`).join('')}</div></div><div class="quiz-bottom"><button class="btn btn-secondary prev" id="prev" ${i===0?'disabled style="opacity:.4"':''}>上一题</button><div class="hint">${esc(CONFIG.answer_hint||'不用寻找正确答案，选择最接近真实自己的选项。')}</div></div></section>`;app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(Number(b.dataset.v)));document.getElementById('prev').onclick=()=>{if(i>0){clearTimeout(transitionTimer);state.current=i-1;save();render();scrollTo({top:0})}}}
function choose(v){const i=state.current,q=CONFIG.questions[i];state.answers[q.id]=v;save();renderQuiz(document.getElementById('app'));clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>{if(i<CONFIG.questions.length-1){state.current=i+1;save();render();scrollTo({top:0})}else{if(Object.keys(state.answers).length!==CONFIG.questions.length)return;state.view='loading';save();render();setTimeout(()=>{state.result=buildResult(state.answers);state.completed=true;state.view='result';save();render();scrollTo({top:0})},1050)}},300)}
function renderLoading(app){app.innerHTML=`<section class="loading"><div><div class="ring"></div><h2>${esc(CONFIG.loading1)}</h2><p>${esc(CONFIG.loading2)}</p></div></section>`}
function radarSVG(scores,primary){const keys=Object.keys(CONFIG.dimensions),cx=150,cy=150,R=100,n=keys.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(r,i)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r],poly=r=>keys.map((_,i)=>pt(r,i).join(',')).join(' '),data=keys.map((k,i)=>pt(R*(scores[k]||0)/100,i).join(',')).join(' '),labels=keys.map((k,i)=>{const [x,y]=pt(R+30,i);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="${k===primary?800:600}" fill="${k===primary?'#171717':'#77736B'}">${esc(CONFIG.dimensions[k])}</text>`}).join('');return `<svg viewBox="0 0 300 300" width="100%" style="max-width:365px" role="img" aria-label="结果雷达图">${[20,40,60,80,100].map(v=>`<polygon points="${poly(R*v/100)}" fill="none" stroke="#E8E4DA"/>`).join('')}${keys.map((_,i)=>{const [x,y]=pt(R,i);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E8E4DA"/>`}).join('')}<polygon points="${data}" fill="color-mix(in srgb,var(--accent) 18%,transparent)" stroke="var(--accent)" stroke-width="2.2"/>${keys.map((k,i)=>{const [x,y]=pt(R*(scores[k]||0)/100,i);return `<circle cx="${x}" cy="${y}" r="3.4" fill="var(--accent)"/>`}).join('')}${labels}</svg>`}
function card(title,content,list=false){return `<section class="card result-card"><h2>${esc(title)}</h2>${list?`<ul>${content.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(content)}</p>`}</section>`}
function renderResult(app){const r=state.result,p=CONFIG.profiles[r.primary];if(!p){state.view='home';render();return}const dims=Object.keys(CONFIG.dimensions);const sec=r.secondary&&CONFIG.profiles[r.secondary];app.innerHTML=`<section class="result"><div class="card result-hero"><div class="eyebrow">${esc(CONFIG.result_top_label)}</div><h1>${esc(CONFIG.result_title)}</h1><div class="type">${esc(r.displayName||p.name)}</div>${sec?`<div class="subtype">${r.dual?`同时具有明显的${esc(sec.name)}倾向`:`副倾向：${esc(sec.name)}`}</div>`:''}<div class="keywords">${esc(p.keywords)}</div><p class="one-line">${esc(p.oneLine)}</p></div><section class="card result-card"><h2>${esc(CONFIG.chart_title)}</h2><div class="chart-wrap">${radarSVG(r.scores,r.primary)}</div><div class="scores">${dims.map(k=>`<div class="score-row ${k===r.primary?'primary':''}"><span>${esc(CONFIG.dimensions[k])}</span><div><div class="bar"><span style="width:${r.scores[k]}%"></span></div><div class="score-label">${label(r.scores[k])}倾向</div></div><strong>${r.scores[k]}</strong></div>`).join('')}</div></section>${CONFIG.result_sections.map(s=>card(s.title,p[s.key],s.list)).join('')}<section class="card bottom"><h2>${esc(CONFIG.bottom_title)}</h2><strong>${esc(CONFIG.bottom_strong)}</strong><p>${esc(CONFIG.bottom_text)}</p><div class="actions"><button class="btn btn-primary" id="copy">复制我的结果</button><button class="btn btn-secondary" id="reset">重新测试</button></div></section></section>`;document.getElementById('copy').onclick=copyResult;document.getElementById('reset').onclick=reset}
function copyResult(){const r=state.result,p=CONFIG.profiles[r.primary],sec=r.secondary?CONFIG.profiles[r.secondary]:null;const text=makeCopyText(r,p,sec);const done=()=>toast('结果已复制，可以分享给朋友了。');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));else fallback(text,done)}
function fallback(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done()}catch(e){toast('复制失败，请长按手动复制。')}ta.remove()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function reset(){if(!confirm('确定重新测试吗？当前结果将被清除。'))return;clearAll();state={view:'home',answers:{},current:0,completed:false,result:null};render();scrollTo({top:0,behavior:'smooth'})}

function effective(q,a){return q.reverse?6-a:a}
function calc(answers){const raw={A:0,B:0,C:0,T:0,R:0};for(const q of CONFIG.questions)raw[q.dimension]+=effective(q,Number(answers[q.id]));const s={};for(const k of Object.keys(raw))s[k]=Math.round((raw[k]-5)/20*100);return s}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)))}
function buildResult(answers){const s=calc(answers);const ps={ST:clamp(.28*s.T+.27*s.R+.23*s.B+.12*s.C+.10*s.A),WA:clamp(.36*s.A+.28*s.C+.16*s.T+.10*s.R+.10*(100-s.B)),CB:clamp(.40*s.B+.23*s.T+.15*s.R+.12*(100-s.A)+.10*s.C),HS:clamp(.34*s.A+.22*s.C+.30*(100-s.T)+.14*(100-s.B)),IS:clamp(.32*s.B+.26*(100-s.A)+.20*(100-s.C)+.12*s.T+.10*(100-s.R))};const ranked=Object.keys(ps).sort((a,b)=>ps[b]-ps[a]);return {scores:s,profileScores:ps,primary:ranked[0],secondary:ranked[1],dual:ps[ranked[0]]-ps[ranked[1]]<=5}}
function makeCopyText(r,p,sec){return `我的关系人格：${p.name}\n${sec?`副倾向：${sec.name}\n`:''}五维得分：\n连接投入 ${r.scores.A}\n边界自主 ${r.scores.B}\n情绪表达 ${r.scores.C}\n信任安全 ${r.scores.T}\n冲突修复 ${r.scores.R}\n关键词：${p.keywords}\n${p.oneLine}\n你是哪种关系人格？\n${location.href}`}
function selfTest(){console.assert(CONFIG.questions.length===25,'25 questions');for(const k of Object.keys(CONFIG.dimensions))console.assert(CONFIG.questions.filter(q=>q.dimension===k).length===5,k+' 5q');const a=Object.fromEntries(CONFIG.questions.map(q=>[q.id,3]));const r=buildResult(a);console.assert(r.primary&&r.scores.A===50,'neutral')}

load();selfTest();render();
})();
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F7F6F2" />
  <title>副业赚钱人格测试</title>
  <style>
    :root{--background:#F7F6F2;--card:#FFFFFF;--text:#171717;--secondary:#77736B;--accent:#C59A4A;--border:#E8E4DA;--shadow:0 6px 24px rgba(23,23,23,.04)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--background);color:var(--text);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.72;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid rgba(197,154,74,.36);outline-offset:3px}.app{width:100%;max-width:640px;margin:0 auto;min-height:100svh;padding:0 20px 44px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}.hero{padding:72px 0 44px}.hero h1{font-size:38px;line-height:1.22;margin:14px 0 18px;letter-spacing:-.03em}.hero p{margin:0;color:var(--secondary);font-size:17px}.hero-copy{white-space:pre-line}.meta-row{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0;color:var(--secondary);font-size:14px}.primary-btn,.secondary-btn,.answer-btn{border:0;border-radius:16px;min-height:52px;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease}.primary-btn{width:100%;background:var(--text);color:#fff;font-weight:700;padding:14px 18px}.primary-btn:active,.answer-btn:active{transform:scale(.985)}.secondary-btn{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:650;padding:12px 16px}.section{padding:30px 0}.section h2{font-size:26px;line-height:1.3;margin:0 0 14px}.section p{color:var(--secondary);margin:0 0 14px}.gold-quote{font-size:22px;color:var(--text)!important;font-weight:700;line-height:1.5}.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.dimension-card h3{margin:0 0 6px;font-size:18px}.dimension-card p{margin:0}.footer-cta{margin-top:18px;text-align:center;padding:28px}.footer-cta strong{display:block;font-size:22px;margin:8px 0 18px}.quiz{min-height:100svh;display:flex;flex-direction:column;padding:28px 0 20px}.quiz-top{position:sticky;top:0;background:linear-gradient(var(--background) 82%,rgba(247,246,242,0));padding:6px 0 20px;z-index:2}.progress-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--secondary);font-weight:700}.progress-track{height:5px;background:#EAE6DC;border-radius:999px;margin-top:10px;overflow:hidden}.progress-fill{height:100%;background:var(--accent);border-radius:inherit;transition:width .25s ease}.question-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}.question-number{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.12em}.question{font-size:26px;line-height:1.55;font-weight:700;margin:12px 0 26px}.answers{display:flex;flex-direction:column;gap:10px}.answer-btn{background:var(--card);color:var(--text);border:1px solid var(--border);text-align:left;padding:15px 17px;font-weight:600;min-height:56px}.answer-btn.selected{border-color:var(--accent);background:#FBF6EA;box-shadow:0 0 0 2px rgba(197,154,74,.12)}.quiz-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px}.hint{font-size:12px;color:var(--secondary);text-align:right;max-width:210px}.loading{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center}.loader-ring{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 24px;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{font-size:24px;margin:0 0 10px}.loading p{color:var(--secondary);margin:0}.result{padding-top:48px}.result-hero{text-align:center;padding:30px 20px}.result-hero h1{font-size:18px;margin:8px 0;color:var(--secondary);font-weight:600}.type-name{font-size:38px;line-height:1.2;font-weight:800;letter-spacing:-.03em;margin:10px 0 12px}.secondary-type{color:var(--secondary);font-size:15px}.keywords{margin-top:16px;font-weight:700;color:var(--accent);letter-spacing:.05em}.one-line{font-size:20px;line-height:1.65;font-weight:650;margin:24px 0 0}.result-section{margin-top:14px}.result-section h2{font-size:20px;margin:0 0 12px}.result-section p{white-space:pre-line;margin:0;color:#3E3B36}.bullet-list{margin:0;padding-left:20px;color:#3E3B36}.bullet-list li+li{margin-top:7px}.radar-wrap{padding:14px 0 4px;display:flex;justify-content:center}.scores{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.score-row{display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:10px;font-size:14px}.score-bar{height:7px;background:#EEEAE1;border-radius:999px;overflow:hidden}.score-bar span{display:block;height:100%;background:var(--accent);border-radius:inherit}.score-row.primary{font-weight:800}.score-row.primary .score-bar{height:9px}.interpret{font-size:12px;color:var(--secondary)}.bottom-copy{text-align:center;margin:32px 0 16px;padding:30px 20px}.bottom-copy h2{font-size:18px;color:var(--secondary);margin:0}.bottom-copy strong{display:block;font-size:24px;line-height:1.5;margin:12px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#171717;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20;width:max-content;max-width:calc(100vw - 32px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
    @media(min-width:520px){.app{padding-left:28px;padding-right:28px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:44px}.scores{gap:10px}}
    @media(max-width:390px){.app{padding-left:16px;padding-right:16px}.hero{padding-top:56px}.hero h1{font-size:33px}.question{font-size:23px}.type-name{font-size:34px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='sideHustleMoneyType_v2';
  const DIMENSIONS={T:'成交力',S:'解题力',C:'表达力',P:'产品力',O:'经营力'};
  const TYPE_NAMES={T:'成交猎手型',S:'专业解题型',C:'内容放大型',P:'产品构建型',O:'稳健经营型'};
  const ANSWERS=[
    {label:'非常不像我',value:1},{label:'比较不像我',value:2},{label:'说不清 / 一般',value:3},{label:'比较像我',value:4},{label:'非常像我',value:5}
  ];
  const questions=[
    {id:1,text:'当我发现一件事情需要反复做很多次时，我经常会想：有没有办法把它做成模板、流程或者工具，以后直接复用？',dimension:'P',reverse:false},
    {id:2,text:'即使一个东西只有六七十分完成度，只要已经能解决问题，我也愿意先拿出去测试有没有人愿意付钱。',dimension:'T',reverse:false},
    {id:3,text:'相比向很多人介绍自己，我更擅长面对一个具体的人，听懂他的问题，然后帮他解决。',dimension:'S',reverse:false},
    {id:4,text:'我通常能够把一个复杂的东西讲成别人容易理解、愿意继续听下去的内容。',dimension:'C',reverse:false},
    {id:5,text:'如果一个项目已经证明有效，我可以接受长期重复维护，而不是不断寻找新鲜项目。',dimension:'O',reverse:false},
    {id:6,text:'即使我有一个不错的观点，我通常也更愿意自己想想或者私下讨论，而不是公开表达。',dimension:'C',reverse:true},
    {id:7,text:'如果别人拒绝了我的报价，我通常不会把它理解成“我不适合赚钱”或者“我的东西没人要”，我会继续找下一种成交方式。',dimension:'T',reverse:false},
    {id:8,text:'整理流程、设计模板、建立自动化规则这类事情，很容易让我觉得麻烦，做一半就不想继续。',dimension:'P',reverse:true},
    {id:9,text:'当别人只模糊地说“我这里有个问题，你能不能帮我看看？”我通常能够通过追问，把真正的问题逐渐弄清楚。',dimension:'S',reverse:false},
    {id:10,text:'一件事情如果需要连续几个月重复执行、观察、调整、再执行，我通常很快就会失去兴趣。',dimension:'O',reverse:true},
    {id:11,text:'看到一件事情时，我经常会自然地想到：这件事情如果讲给别人听，应该从哪个角度讲才有意思。',dimension:'C',reverse:false},
    {id:12,text:'真正需要开口报价、收费或者催付款时，我会明显不自在，甚至宁愿免费帮别人做。',dimension:'T',reverse:true},
    {id:13,text:'相比每次亲自从头做一遍，我更喜欢第一次多花一点时间，把系统搭好，以后重复使用。',dimension:'P',reverse:false},
    {id:14,text:'如果每天都要面对不同客户、处理不同人的特殊要求，我会觉得特别消耗。',dimension:'S',reverse:true},
    {id:15,text:'一个项目数据不好时，我通常更愿意先找问题、改一个变量、再观察，而不是马上换一个项目。',dimension:'O',reverse:false},
    {id:16,text:'如果一种赚钱方式意味着长期被别人看到、评论、评价甚至质疑，我会非常抗拒。',dimension:'C',reverse:true},
    {id:17,text:'生活里看到一个问题时，我经常会自然地想到：“这个问题如果有人解决，谁会愿意为它付钱？”',dimension:'T',reverse:false},
    {id:18,text:'如果发现自己已经做过三次类似工作，我通常会开始想：怎样把它标准化，让第四次不需要重新做。',dimension:'P',reverse:false},
    {id:19,text:'别人告诉我一个需求后，我通常能比较快地判断：他真正需要的结果是什么，以及我到底要交付什么。',dimension:'S',reverse:false},
    {id:20,text:'即使一个项目短期没有爆发，只要数据证明方向还成立，我通常可以按固定节奏继续做下去。',dimension:'O',reverse:false}
  ];
  const resultProfiles={
    T:{name:'成交猎手型',englishName:'DEAL MAKER',keywords:'需求 · 价格 · 成交 · 现金流',oneLine:'你最强的能力，不一定是把东西做到最好，而是你比很多人更容易判断——什么东西有人愿意掏钱。',moneyLogic:'你天然更靠近商业的最后一步：成交。\n\n很多人喜欢研究产品、学习技能、做内容，却迟迟不敢真正收费。\n\n你更容易接受这样一个事实：\n\n一个东西有没有商业价值，最终要看有没有人愿意付钱。\n\n所以相比“准备半年再开始”，你更适合：\n\n先找需求 → 快速测试 → 报价 → 成交 → 根据反馈调整。',strengths:['发现谁有需求','判断什么东西能够卖','快速测试价格','和客户讨论价值','承受一定程度的拒绝','优先考虑现金流而不是完美'],suitableSideHustles:['二手交易','选品销售','闲鱼项目','代理销售','渠道撮合','本地服务撮合','资源对接','佣金型业务','轻咨询销售','标准化服务销售'],aiStrategy:'AI 对你最大的价值，不是替你思考，而是让你更快拿东西出去卖。\n\n可以使用 AI 制作商品文案、销售页、报价单、客户回复、市场分析和最小可行产品。\n\n你负责真正重要的部分：\n\n市场判断和成交。',biggestRisk:'你的问题往往不是不敢开始，而是太容易开始。\n\n只要看到赚钱机会，就可能快速冲进去。\n\n今天看到闲鱼，明天看到短剧，后天看到跨境，过几天又看到 AI 工具。\n\n成交敏感是一种优势。\n\n但如果没有筛选机制，它也会变成“机会成瘾”。',skillToImprove:'产品力或经营力。\n\n你需要把“偶尔赚到一次钱”逐渐变成“这件事情可以重复赚钱”。',firstStep:'不要先学习一个月。\n\n找一个真实、具体、已经有人付钱解决的小需求。\n\n然后问：\n\n“我能不能在 7 天之内完成第一次收费测试？”\n\n你的副业不是从 logo 开始，而是从第一笔成交开始。'},
    S:{name:'专业解题型',englishName:'PROBLEM SOLVER',keywords:'问题 · 方案 · 交付 · 信任',oneLine:'别人遇到麻烦时，你能把事情弄明白，并真正解决掉。',moneyLogic:'你未必喜欢主动销售，也未必愿意每天公开输出。\n\n但如果有人带着一个真实问题找到你，你通常能够迅速进入状态：\n\n听需求、找原因、拆问题、给方案、完成交付。\n\n这是一种一直有效的赚钱能力：\n\n解决问题。\n\n真正值钱的部分不是“帮别人干活”。\n\n而是：\n\n别人不知道怎么办，而你知道。\n\n客户购买的是确定性。',strengths:['听懂需求','通过追问找到真正问题','拆解复杂问题','提供具体解决方案','完成实际交付','建立专业信任'],suitableSideHustles:['咨询','陪跑','代办','代做','设计','资料整理','方案制作','简历优化','AI定制服务','数据整理','专业顾问','教育辅导','垂直行业服务'],aiStrategy:'过去一个人一天只能解决有限数量的问题。\n\n现在 AI 可以替你完成搜索、整理、初稿、分类、格式化和大量重复工作。\n\n你负责：\n\n判断问题。\n\nAI负责：\n\n提高交付效率。\n\n真正可以出售的是：\n\n“AI + 你的判断力”。',biggestRisk:'你非常容易陷入“能者多劳”。\n\n因为你会解决问题，所以别人不断把问题交给你。\n\n最后可能很忙、客户很多、事情很多，但收入没有同比增长。\n\n根本原因是：\n\n你一直在出售自己的时间。',skillToImprove:'产品力。\n\n当同一个问题已经解决过三次，就应该问：\n\n“这部分能不能做成模板、标准流程、资料包或者工具？”\n\n升级路线：\n\n接单 → 标准化服务 → 模板 → 产品 → 系统',firstStep:'回忆过去半年：\n\n别人最经常找你帮忙解决哪三件事？\n\n不要问“我会什么”。\n\n要问：\n\n“别人已经因为什么事情来找过我？”\n\n那里通常藏着最容易卖出去的第一个服务。'},
    C:{name:'内容放大型',englishName:'CONTENT AMPLIFIER',keywords:'表达 · 注意力 · 信任 · 影响力',oneLine:'你最重要的能力，是把你知道的东西变成别人愿意看的东西。',moneyLogic:'信息本身越来越便宜。\n\n真正稀缺的是有人能够筛选、解释、组织、表达并形成观点。\n\n如果你的表达力明显高于其他维度，你更容易通过：\n\n内容 → 注意力 → 信任 → 商业化\n\n完成变现。\n\n你真正拥有的资产，不是某一条爆款。\n\n而是：\n\n别人为什么愿意持续听你说话。\n\n这就是信任资产。',strengths:['发现有传播价值的角度','解释复杂信息','形成自己的表达方式','持续获得注意力','通过内容建立信任','把观点传播给更多人'],suitableSideHustles:['自媒体','知识账号','垂直内容账号','短视频','小红书','公众号','知识付费','课程','社群','个人IP','内容电商','联盟营销','品牌合作'],aiStrategy:'AI 可以帮助你找选题、整理资料、生成结构、优化标题、转写内容以及批量制作。\n\n但最不能完全交给 AI 的是你的判断。\n\n真正有效的模式不是：\n\n“AI 替你批量生产内容。”\n\n而是：\n\n“你提供判断，AI 放大生产效率。”',biggestRisk:'内容是最容易制造“我好像在做事业”错觉的行业之一。\n\n阅读量、点赞、粉丝、播放量、每天更新，都可能让人产生进展感。\n\n但真正的问题只有一个：\n\n这些注意力最后通过什么路径变成钱？\n\n如果没有变现路径，做得越勤奋，越可能变成一个免费的内容生产者。',skillToImprove:'成交力。\n\n必须明确：\n\n内容 → 吸引谁 → 建立什么信任 → 卖什么 → 为什么付钱。',firstStep:'选择一个你可以持续输出的真实主题。\n\n然后不要先追求 10 万粉丝。\n\n先回答：\n\n“如果只有 100 个精准关注者，我准备卖什么？”\n\n能回答这个问题，内容才开始真正变成生意。'},
    P:{name:'产品构建型',englishName:'PRODUCT BUILDER',keywords:'系统 · 标准化 · 复用 · 杠杆',oneLine:'你最值得发展的能力，是把一次劳动变成可以重复出售的东西。',moneyLogic:'你和单纯靠时间赚钱的人最大的区别在于：\n\n你会自然地想：\n\n这件事情能不能标准化？\n\n能不能模板化？\n\n能不能自动化？\n\n能不能以后不用重新做？\n\n这就是产品思维。\n\n你真正喜欢的不是单纯“做东西”。\n\n而是：\n\n搭一台可以反复工作的机器。\n\n它可能只是：\n\n一个 Excel、一个模板、一个数据库、一套提示词、一个网页、一个小程序、一个 AI 工具或者一个微型 SaaS。\n\n本质都是：\n\n做一次，多次出售。',strengths:['发现重复问题','建立标准化流程','设计模板','把服务产品化','寻找自动化机会','创造可以重复使用的系统'],suitableSideHustles:['数字产品','模板','Excel工具','Notion产品','资料库','AI工具','网页工具','在线计算器','测试类网站','Chrome插件','小程序','微型SaaS','垂直小App'],aiStrategy:'这是被 AI 明显放大的一种赚钱模式。\n\n过去不会编程，很多产品想法只能停在脑子里。\n\n现在可以由你负责：\n\n找到问题、定义功能、设计逻辑、判断结果。\n\n让 AI 完成大量：\n\n前端、代码、页面、调试和迭代工作。\n\n真正重要的不只是“会不会写代码”。\n\n而是：\n\n“你知不知道应该做什么。”',biggestRisk:'产品型的人最容易出现一种高级拖延：\n\n一直做产品，却没有客户。\n\n不停增加功能、页面、算法、动画、登录、数据库和会员系统。\n\n最后产品越来越完整，却没有一个真正愿意付钱的人。',skillToImprove:'成交力。\n\n产品不是做完才验证。\n\n正确路线应该是：\n\n发现需求 → 做最小版本 → 给真实用户用 → 有人愿意付钱 → 再继续开发。',firstStep:'不要开发大 App。\n\n找一个非常小、非常具体、重复发生的问题。\n\n做一个只有一个核心功能的小工具。\n\n目标不是创业。\n\n而是：\n\n让第一个陌生人愿意为这个小东西付钱。'},
    O:{name:'稳健经营型',englishName:'STEADY OPERATOR',keywords:'稳定 · 复利 · 流程 · 长期',oneLine:'一旦证明一件事情有效，你比很多人更有能力把它长期做下去。',moneyLogic:'商业世界里经常被高估的是创意。\n\n被低估的是：\n\n持续经营。\n\n真正赚钱很多年的小生意，往往没有惊人的创新。\n\n只是不断重复：\n\n获客、交付、维护、复购、优化和控制成本。\n\n你天然更适合这种模式。\n\n你真正擅长的是：\n\n把混乱变成稳定。\n\n把偶然变成流程。\n\n把客户变成复购。\n\n把一次收入变成持续收入。',strengths:['长期执行','维护稳定流程','持续优化','控制经营细节','重视复购','让有效模式形成复利'],suitableSideHustles:['稳定型网店','垂直闲鱼店','本地服务','长期代运营','会员服务','订阅服务','资源库','小型工作室','社群','长期维护型数字产品','成熟项目运营'],aiStrategy:'别人可能用 AI 追热点。\n\n你更应该使用 AI 降低长期经营成本。\n\n包括：\n\n自动回复、客户分类、内容批量生产、数据整理、订单管理、运营复盘、SOP 和自动化工作流。\n\n这样一个人也可能运营过去需要几个人才能维持的小生意。',biggestRisk:'你的稳定性也可能逐渐变成路径依赖。\n\n一件事情只要已经投入时间，就可能不愿轻易放弃。\n\n必须区分：\n\n“坚持一个有效模式”\n\n与\n\n“坚持一个已经被市场证明无效的模式”。\n\n后者不是长期主义，而是沉没成本。',skillToImprove:'机会判断能力。\n\n定期检查：\n\n客户还存在吗？\n\n需求还存在吗？\n\n利润还存在吗？\n\n如果这些答案已经变化，就应该调整。',firstStep:'找一个已经有人持续付钱购买，而不是需要教育市场的需求。\n\n然后设定目标：\n\n“我能不能连续 90 天，把这件小事稳定做好？”\n\n你的优势不是一夜爆发。\n\n你的优势是别人换项目的时候，你已经开始复利。'}
  };
  const CORE={T:[17,7],S:[19,9],C:[4,11],P:[18,1],O:[20,15]};
  const FALLBACK=['P','S','T','C','O'];
  let state={view:'home',answers:{},currentQuestion:0,completed:false,result:null};
  let transitionTimer=null;

  function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);state={...state,...s};if(state.completed&&state.result)state.view='result';else if(Object.keys(state.answers||{}).length>0)state.view='quiz';}}catch(e){}}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
  function resetStorage(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
  function effectiveAnswer(q,ans){return q.reverse?6-ans:ans}
  function calculateScores(answers){const raw={T:0,S:0,C:0,P:0,O:0};questions.forEach(q=>{const ans=Number(answers[q.id]);if(!ans)throw new Error('Incomplete answers');raw[q.dimension]+=effectiveAnswer(q,ans)});const normalized={};Object.keys(raw).forEach(k=>normalized[k]=Math.round(((raw[k]-4)/16)*100));return {raw,normalized}}
  function rankTypes(scores,answers){const groups={};Object.entries(scores).forEach(([k,v])=>{(groups[v]||(groups[v]=[])).push(k)});const sortedScoreValues=Object.keys(groups).map(Number).sort((a,b)=>b-a);const ordered=[];for(const score of sortedScoreValues){const tied=groups[score];if(tied.length===1){ordered.push(tied[0]);continue}tied.sort((a,b)=>compareTie(a,b,answers));ordered.push(...tied)}return ordered}
  function compareTie(a,b,answers){for(let i=0;i<2;i++){const qa=questions.find(q=>q.id===CORE[a][i]);const qb=questions.find(q=>q.id===CORE[b][i]);const va=effectiveAnswer(qa,Number(answers[qa.id]));const vb=effectiveAnswer(qb,Number(answers[qb.id]));if(va!==vb)return vb-va}return FALLBACK.indexOf(a)-FALLBACK.indexOf(b)}
  function buildResult(answers){const {raw,normalized}=calculateScores(answers);const ranked=rankTypes(normalized,answers);const primary=ranked[0],secondary=ranked[1];return {raw,scores:normalized,primary,secondary,gap:normalized[primary]-normalized[secondary],dual:normalized[primary]-normalized[secondary]<=5}}
  function scoreLabel(v){if(v<=39)return '低倾向';if(v<=59)return '一般倾向';if(v<=74)return '明显倾向';return '强倾向'}
  function esc(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
  function render(){const app=document.getElementById('app');if(state.view==='home')renderHome(app);else if(state.view==='quiz')renderQuiz(app);else if(state.view==='loading')renderLoading(app);else renderResult(app)}
  function renderHome(app){app.innerHTML=`<section class="hero"><div class="eyebrow">SIDE HUSTLE MONEY TYPE</div><h1>你更适合靠什么方式赚钱？</h1><p class="hero-copy">很多副业做不下去，\n不是因为你不够努力。\n而是因为你选了一条：\n天然阻力很大的赚钱路径。\n\n20 道题。\n约 2 分钟。\n测出你的：\n副业赚钱人格</p><div class="meta-row"><span>20 道题</span><span>约 2 分钟</span><span>无需注册</span></div><button class="primary-btn" id="startBtn">开始测试</button></section><section class="section"><div class="eyebrow">FIVE MONEY PATHS</div><h2>五种赚钱路径</h2><p>有人天然擅长成交。<br>有人擅长解决问题。<br>有人擅长表达。<br>有人喜欢做产品。<br>有人擅长长期经营。</p><p>没有绝对最好的类型。</p><p class="gold-quote">真正的问题是：<br>你现在选择的副业，与你的优势匹配吗？</p><div class="grid">${[['成交力','能不能快速找到付钱的人。'],['解题力','能不能真正替别人解决问题。'],['表达力','能不能通过内容获得信任。'],['产品力','能不能把能力标准化、重复出售。'],['经营力','能不能把有效的事情持续做下去。']].map(x=>`<article class="card dimension-card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div></section><section class="card footer-cta"><div>20 道题 · 约 2 分钟 · 无需注册</div><strong>立即查看结果</strong><button class="primary-btn" id="startBtn2">开始测试 →</button></section>`;document.getElementById('startBtn').onclick=startQuiz;document.getElementById('startBtn2').onclick=startQuiz}
  function startQuiz(){state.view='quiz';state.completed=false;if(typeof state.currentQuestion!=='number')state.currentQuestion=0;save();render();window.scrollTo({top:0})}
  function renderQuiz(app){const i=Math.min(Math.max(state.currentQuestion,0),19),q=questions[i],selected=state.answers[q.id];const pct=((i)/20)*100;app.innerHTML=`<section class="quiz"><div class="quiz-top"><div class="progress-head"><span>${String(i+1).padStart(2,'0')} / 20</span><span>${Math.round((i/20)*100)}%</span></div><div class="progress-track" aria-label="答题进度"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="question-wrap"><div class="question-number">QUESTION ${String(i+1).padStart(2,'0')}</div><div class="question">${esc(q.text)}</div><div class="answers">${ANSWERS.map(a=>`<button class="answer-btn ${selected===a.value?'selected':''}" data-value="${a.value}">${esc(a.label)}</button>`).join('')}</div></div><div class="quiz-bottom"><button class="secondary-btn" id="prevBtn" ${i===0?'disabled style="opacity:.4"':''}>上一题</button><div class="hint">不用寻找正确答案，选择真实的自己。</div></div></section>`;app.querySelectorAll('.answer-btn').forEach(btn=>btn.onclick=()=>chooseAnswer(Number(btn.dataset.value)));document.getElementById('prevBtn').onclick=()=>{if(i>0){clearTimeout(transitionTimer);state.currentQuestion=i-1;save();render();window.scrollTo({top:0})}}}
  function chooseAnswer(value){const i=state.currentQuestion,q=questions[i];state.answers[q.id]=value;save();renderQuiz(document.getElementById('app'));clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>{if(i<19){state.currentQuestion=i+1;save();render();window.scrollTo({top:0})}else{if(Object.keys(state.answers).length!==20)return;state.view='loading';save();render();setTimeout(()=>{try{state.result=buildResult(state.answers);state.completed=true;state.view='result';save();render();window.scrollTo({top:0})}catch(e){state.view='quiz';render()}},1100)}},300)}
  function renderLoading(app){app.innerHTML=`<section class="loading"><div><div class="loader-ring"></div><h2>正在计算你的五维赚钱模型……</h2><p>正在匹配最适合你的变现路径……</p></div></section>`}
  function radarSVG(scores,primary){const cx=150,cy=150,R=102,axes=['T','S','C','P','O'];const angle=i=>-Math.PI/2+i*2*Math.PI/5;const pt=(r,i)=>[cx+Math.cos(angle(i))*r,cy+Math.sin(angle(i))*r];const poly=r=>axes.map((_,i)=>pt(r,i).join(',')).join(' ');const data=axes.map((k,i)=>pt(R*scores[k]/100,i).join(',')).join(' ');const labels=axes.map((k,i)=>{const [x,y]=pt(R+28,i);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="${k===primary?800:600}" fill="${k===primary?'#171717':'#77736B'}">${DIMENSIONS[k]}</text>`}).join('');return `<svg viewBox="0 0 300 300" width="100%" style="max-width:360px" role="img" aria-label="五维赚钱能力雷达图">${[20,40,60,80,100].map(v=>`<polygon points="${poly(R*v/100)}" fill="none" stroke="#E8E4DA" stroke-width="1"/>`).join('')}${axes.map((_,i)=>{const [x,y]=pt(R,i);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E8E4DA"/>`}).join('')}<polygon points="${data}" fill="rgba(197,154,74,.18)" stroke="#C59A4A" stroke-width="2.2"/>${axes.map((k,i)=>{const [x,y]=pt(R*scores[k]/100,i);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#C59A4A"/>`}).join('')}${labels}</svg>`}
  function sectionCard(title,content,isList=false){return `<section class="card result-section"><h2>${title}</h2>${isList?`<ul class="bullet-list">${content.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(content)}</p>`}</section>`}
  function renderResult(app){if(!state.result){state.view='home';render();return}const r=state.result,p=resultProfiles[r.primary],sec=resultProfiles[r.secondary];const order=['T','S','C','P','O'];app.innerHTML=`<section class="result"><div class="card result-hero"><div class="eyebrow">YOUR MONEY TYPE</div><h1>你的赚钱人格是</h1><div class="type-name">${p.name}</div><div class="secondary-type">${r.dual?`同时具有明显的${sec.name.replace('型','')}倾向`:`副倾向：${sec.name}`}</div><div class="keywords">${p.keywords}</div><p class="one-line">${p.oneLine}</p></div><section class="card result-section"><h2>你的五维赚钱模型</h2><div class="radar-wrap">${radarSVG(r.scores,r.primary)}</div><div class="scores">${order.map(k=>`<div class="score-row ${k===r.primary?'primary':''}"><span>${DIMENSIONS[k]}</span><div><div class="score-bar"><span style="width:${r.scores[k]}%"></span></div><div class="interpret">${scoreLabel(r.scores[k])}</div></div><strong>${r.scores[k]}</strong></div>`).join('')}</div></section>${sectionCard('你的核心赚钱逻辑',p.moneyLogic)}${sectionCard('你真正擅长什么',p.strengths,true)}${sectionCard('最适合你的副业',p.suitableSideHustles,true)}${sectionCard('AI 时代你的优势',p.aiStrategy)}${sectionCard('你最容易踩的坑',p.biggestRisk)}${sectionCard('你需要补的一块能力',p.skillToImprove)}${sectionCard('现在最应该做什么',p.firstStep)}<section class="card bottom-copy"><h2>别急着问：现在什么副业最赚钱？</h2><strong>先问：什么赚钱方式，我比大多数人更容易长期做下去？</strong><p>找到自己的赚钱方式，<br>比不断寻找下一个风口更重要。</p><div class="actions"><button class="primary-btn" id="copyBtn">复制我的结果</button><button class="secondary-btn" id="resetBtn">重新测试</button></div></section></section>`;document.getElementById('copyBtn').onclick=copyResult;document.getElementById('resetBtn').onclick=resetTest}
  function copyResult(){const r=state.result,p=resultProfiles[r.primary],sec=resultProfiles[r.secondary],url=location.href;const text=`我的副业赚钱人格：${p.name}\n副倾向：${sec.name}\n五维得分：\n成交力 ${r.scores.T}\n解题力 ${r.scores.S}\n表达力 ${r.scores.C}\n产品力 ${r.scores.P}\n经营力 ${r.scores.O}\n我的赚钱关键词：\n${p.keywords}\n${p.oneLine}\n你是什么赚钱人格？\n${url}`;const done=()=>toast('结果已复制，可以分享给朋友了。');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done))}else fallbackCopy(text,done)}
  function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done()}catch(e){toast('复制失败，请长按手动复制。')}document.body.removeChild(ta)}
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
  function resetTest(){if(!confirm('确定重新测试吗？当前结果将被清除。'))return;resetStorage();state={view:'home',answers:{},currentQuestion:0,completed:false,result:null};render();window.scrollTo({top:0,behavior:'smooth'})}

  // lightweight internal validation (non-UI)
  function selfTest(){
    console.assert(questions.length===20,'20 questions');
    for(const k of Object.keys(DIMENSIONS))console.assert(questions.filter(q=>q.dimension===k).length===4,k+' has four');
    console.assert(questions.filter(q=>q.reverse).map(q=>q.id).join(',')==='6,8,10,12,14,16','reverse ids');
    const all5=Object.fromEntries(questions.map(q=>[q.id,5]));const a=calculateScores(all5).normalized;console.assert(JSON.stringify(a)===JSON.stringify({T:75,S:75,C:50,P:75,O:75}),'all5 scores');
    for(const k of Object.keys(DIMENSIONS)){
      const ans=Object.fromEntries(questions.map(q=>[q.id,3]));questions.filter(q=>q.dimension===k).forEach(q=>ans[q.id]=q.reverse?1:5);const rr=buildResult(ans);console.assert(rr.primary===k,'primary '+k);
    }
  }
  load();selfTest();render();
})();
</script>
